[package]
name = "lc-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bytes = "1.12.1"
getrandom = "0.4.3"
hex = "0.4.3"
lc-protocol = { path = "../lc-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
lc-testkit = { path = "../lc-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "signal"] }
tracing-subscriber = "0.3.23"
