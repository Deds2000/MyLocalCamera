name: Windows CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Select Rust toolchain
        run: rustup default 1.99.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: JavaScript tests
        run: pnpm test

      - name: Validate vectors
        run: pnpm vectors:check

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # fixtures/ é gitignored e não vem no checkout. hd30.h264 e pattern43.h264
      # são exigidos por cargo test. Versão do ffmpeg travada (9.0.2) para não
      # depender do que o runner traz no PATH.
      - name: Install ffmpeg (pinned)
        run: choco install ffmpeg --version=9.0.2 -y --no-progress

      - name: Generate test fixtures
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/make-fixtures.ps1

      - name: Rust tests
        run: cargo test --workspace

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E
        run: pnpm e2e

      # Legacy formatting debt predates R-03; this gate blocks new violations in PR changes.
      - name: Prettier on changed files (blocking)
        shell: pwsh
        run: |
          $base = if ('${{ github.event_name }}' -eq 'pull_request') { 'origin/${{ github.event.pull_request.base.ref }}' } else { 'origin/main' }
          git fetch origin $base.Split('/')[1]
          $files = git diff --name-only --diff-filter=ACMRT "$base...HEAD" | Where-Object { Test-Path $_ }
          if ($files) { pnpm exec prettier --check $files; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Prettier baseline (informational)
        continue-on-error: true
        run: pnpm exec prettier --check .
