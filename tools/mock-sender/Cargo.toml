[package]
name = "mock-sender"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
lc-protocol = { version = "0.0.0", path = "../../crates/lc-protocol" }
lc-testkit = { version = "0.0.0", path = "../../crates/lc-testkit" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
lc-server = { path = "../../crates/lc-server" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
