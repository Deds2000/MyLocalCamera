[package]
name = "s2-pipe-server"
version = "0.1.0"
edition = "2021"
publish = false

# Crate descartável do spike S2, FORA do workspace principal do repositório
# (ver docs/tasks/fase-0/F0-S2.md, passo 1). A tabela [workspace] vazia isola
# esta crate da raiz do repositório.
[workspace]

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Performance", "Win32_System_IO"] }
